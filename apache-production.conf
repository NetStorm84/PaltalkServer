# H2KTalk Apache Production Configuration
# Place this file in /etc/apache2/sites-available/h2ktalk.conf
# Enable with: sudo a2ensite h2ktalk.conf && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName h2ktalk.fun
    ServerAlias www.h2ktalk.fun
    DocumentRoot /var/www/h2ktalk.fun/h2ktalk-web/public
    
    # Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName h2ktalk.fun
    ServerAlias www.h2ktalk.fun
    DocumentRoot /var/www/h2ktalk.fun/h2ktalk-web/public
    
    # SSL Configuration (replace with your actual SSL certificate paths)
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/h2ktalk.fun.crt
    SSLCertificateKeyFile /etc/ssl/private/h2ktalk.fun.key
    SSLCertificateChainFile /etc/ssl/certs/h2ktalk.fun-chain.crt
    
    # Security Headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # Laravel Configuration
    <Directory /var/www/h2ktalk.fun/h2ktalk-web/public>
        AllowOverride All
        Require all granted
        
        # Laravel URL Rewriting
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>
    
    # Proxy Node.js Server for API and Socket.IO
    ProxyPreserveHost On
    ProxyRequests Off
    
    # Proxy Socket.IO traffic to Node.js server
    ProxyPass /socket.io/ http://localhost:3000/socket.io/
    ProxyPassReverse /socket.io/ http://localhost:3000/socket.io/
    
    # Enable WebSocket proxying for Socket.IO
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/socket.io/(.*)$ ws://localhost:3000/socket.io/$1 [P,L]
    
    # Proxy health check and API endpoints to Node.js
    ProxyPass /api/health http://localhost:3000/api/health
    ProxyPassReverse /api/health http://localhost:3000/api/health
    
    # Optional: Proxy entire Node.js web interface under /node/ path
    ProxyPass /node/ http://localhost:3000/
    ProxyPassReverse /node/ http://localhost:3000/
    
    # Static file optimization
    <FilesMatch "\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$">
        ExpiresActive On
        ExpiresDefault "access plus 1 month"
        Header append Cache-Control "public, immutable"
    </FilesMatch>
    
    # Gzip compression
    <IfModule mod_deflate.c>
        SetOutputFilter DEFLATE
        SetEnvIfNoCase Request_URI \
            \.(?:gif|jpe?g|png)$ no-gzip dont-vary
        SetEnvIfNoCase Request_URI \
            \.(?:exe|t?gz|zip|bz2|sit|rar)$ no-gzip dont-vary
    </IfModule>
    
    # PHP Configuration
    <IfModule mod_php7.c>
        php_value max_execution_time 300
        php_value memory_limit 256M
        php_value upload_max_filesize 10M
        php_value post_max_size 10M
    </IfModule>
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/h2ktalk-error.log
    CustomLog ${APACHE_LOG_DIR}/h2ktalk-access.log combined
    
    # Log level for debugging (change to 'warn' for production)
    LogLevel info
</VirtualHost>

