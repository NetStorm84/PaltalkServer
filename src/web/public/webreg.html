    <meta name="theme-color" content="#000080">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000080;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .reg-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        h1 {
            color: #ffffff;
            margin-bottom: 8px;
            font-size: 1.75rem;
            font-weight: bold;
            text-align: center;
        }
        
        .desc {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
            margin-bottom: 32px;
            text-align: center;
            line-height: 1.5;
        }
        
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #ffffff;
            font-size: 0.875rem;
        }
        
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 1rem;
            font-family: 'Courier New', monospace;
            transition: border-color 0.2s;
        }
        
        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #ff4500;
        }
        
        input[type="text"]::placeholder, input[type="password"]::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .btn {
            width: 100%;
            background: #ff4500;
            color: #ffffff;
            border: 2px solid #ff4500;
            padding: 14px;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }
        
        .btn:hover {
            background: #ff6600;
            border-color: #ff6600;
        }
        
        .btn:disabled {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed;
        }
        
        .error {
            color: #ffffff;
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid #dc2626;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 0.875rem;
        }
        
        .success {
            color: #ffffff;
            background: rgba(255, 69, 0, 0.2);
            border: 1px solid #ff4500;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 0.875rem;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            
            .reg-container {
                padding: 30px 25px;
                max-width: 100%;
            }
            
            h1 {
                font-size: 1.6rem;
            }
            
            .desc {
                font-size: 0.85rem;
                margin-bottom: 25px;
            }
            
            input[type="text"], input[type="password"] {
                padding: 14px;
                font-size: 16px; /* Prevents zoom on iOS */
            }
            
            .btn {
                padding: 16px;
                font-size: 1rem;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .reg-container {
                padding: 20px;
                margin: 0;
            }
            
            h1 {
                font-size: 1.4rem;
            }
            
            .desc {
                font-size: 0.8rem;
                line-height: 1.4;
            }
            
            label {
                font-size: 0.8rem;
            }
            
            input[type="text"], input[type="password"] {
                padding: 12px;
                margin-bottom: 15px;
            }
            
            .btn {
                padding: 14px;
                font-size: 0.9rem;
            }
            
            .error, .success {
                padding: 10px;
                font-size: 0.8rem;
            }
        }
        
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <div class="reg-container">
        <h1>Register for h2ktalk.fun</h1>
        <div class="desc">
            Create your account to join chat rooms and connect with others.<br>
            <b>Do not use your real Paltalk credentials.</b>
        </div>
        <form id="regForm" autocomplete="off" aria-label="Account registration form">
            <div id="formError" class="error" style="display:none;" role="alert" aria-live="assertive"></div>
            <div id="formSuccess" class="success" style="display:none;" role="status" aria-live="polite"></div>
            <label for="first">First Name</label>
            <input type="text" id="first" name="first" maxlength="32" required autocomplete="given-name" aria-describedby="first-help">
            
            <label for="last">Last Name</label>
            <input type="text" id="last" name="last" maxlength="32" required autocomplete="family-name" aria-describedby="last-help">
            
            <label for="nickname">Nickname</label>
            <input type="text" id="nickname" name="nickname" maxlength="32" required autocomplete="username" aria-describedby="nickname-help">
            <span id="nickname-help" class="sr-only">Must be 5+ characters, no brackets, and cannot contain: admin, co-admin, paltalk, support, palsupport</span>
            
            <label for="password">Password</label>
            <input type="password" id="password" name="password" maxlength="64" required autocomplete="new-password" aria-describedby="password-help">
            <span id="password-help" class="sr-only">Choose a strong password for your account security</span>
            
            <button type="submit" class="btn">Register</button>
        </form>
    </div>
    <script>
        const form = document.getElementById('regForm');
        const errorDiv = document.getElementById('formError');
        const successDiv = document.getElementById('formSuccess');
        const nicknameInput = document.getElementById('nickname');
        let nicknameCheckTimeout;

        // Detect API base URL based on current location
        function getApiBaseUrl() {
            const currentPath = window.location.pathname;
            if (currentPath.includes('/server/public/')) {
                // Running under subdirectory, API is likely on port 3000
                return `${window.location.protocol}//${window.location.hostname}:3000`;
            } else {
                // Running directly from Node.js server
                return '';
            }
        }

        // Check if nickname exists
        async function checkNicknameExists(nickname) {
            try {
                const apiBase = getApiBaseUrl();
                const res = await fetch(`${apiBase}/api/check-nickname`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname })
                });
                const data = await res.json();
                return data.exists;
            } catch (err) {
                return false; // Assume available if check fails
            }
        }

        // Real-time nickname validation
        nicknameInput.addEventListener('input', () => {
            clearTimeout(nicknameCheckTimeout);
            const nickname = nicknameInput.value.trim();
            
            // Quick validation checks
            if (nickname.length > 0 && nickname.length < 5) {
                errorDiv.textContent = 'Nickname must be at least 5 characters long.';
                errorDiv.style.display = 'block';
                return;
            }
            
            // Check for blacklisted words
            if (nickname.length >= 5) {
                const blacklistedWords = ['admin', 'co-admin', 'coadmin', 'paltalk', 'support', 'palsupport'];
                const nicknameLC = nickname.toLowerCase();
                
                for (const word of blacklistedWords) {
                    if (nicknameLC.includes(word)) {
                        errorDiv.textContent = `Nickname cannot contain the word "${word}".`;
                        errorDiv.style.display = 'block';
                        return;
                    }
                }
                
                // Check for brackets
                if (nickname.includes('(') || nickname.includes(')')) {
                    errorDiv.textContent = 'Nickname cannot contain brackets ( ).';
                    errorDiv.style.display = 'block';
                    return;
                }
                
                // Check if already taken
                nicknameCheckTimeout = setTimeout(async () => {
                    const exists = await checkNicknameExists(nickname);
                    if (exists) {
                        errorDiv.textContent = 'This nickname is already taken. Please choose another.';
                        errorDiv.style.display = 'block';
                    } else {
                        errorDiv.style.display = 'none';
                    }
                }, 500);
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            const first = form.first.value.trim();
            const last = form.last.value.trim();
            const nickname = form.nickname.value.trim();
            const password = form.password.value;
            
            if (!first || !last || !nickname || !password) {
                errorDiv.textContent = 'All fields are required.';
                errorDiv.style.display = 'block';
                return;
            }

            // Validate nickname format
            if (nickname.length < 5) {
                errorDiv.textContent = 'Nickname must be at least 5 characters long.';
                errorDiv.style.display = 'block';
                return;
            }

            if (!/^[a-zA-Z0-9_-]+$/.test(nickname)) {
                errorDiv.textContent = 'Nickname can only contain letters, numbers, hyphens, and underscores.';
                errorDiv.style.display = 'block';
                return;
            }
            
            // Check for blacklisted words
            const blacklistedWords = ['admin', 'co-admin', 'coadmin', 'paltalk', 'support', 'palsupport'];
            const nicknameLC = nickname.toLowerCase();
            
            for (const word of blacklistedWords) {
                if (nicknameLC.includes(word)) {
                    errorDiv.textContent = `Nickname cannot contain the word "${word}".`;
                    errorDiv.style.display = 'block';
                    return;
                }
            }
            
            // Check for brackets
            if (nickname.includes('(') || nickname.includes(')')) {
                errorDiv.textContent = 'Nickname cannot contain brackets ( ).';
                errorDiv.style.display = 'block';
                return;
            }

            // Final nickname availability check
            const exists = await checkNicknameExists(nickname);
            if (exists) {
                errorDiv.textContent = 'This nickname is already taken. Please choose another.';
                errorDiv.style.display = 'block';
                return;
            }
            
            try {
                const apiBase = getApiBaseUrl();
                const res = await fetch(`${apiBase}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ first, last, nickname, password })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    successDiv.textContent = 'Registration successful! You can now log in.';
                    successDiv.style.display = 'block';
                    // Clear form but keep values in case of error
                } else {
                    errorDiv.textContent = data.error || 'Registration failed.';
                    errorDiv.style.display = 'block';
                    // Keep form values so user doesn't have to re-enter everything
                }
            } catch (err) {
                errorDiv.textContent = 'Server error. Please try again later.';
                errorDiv.style.display = 'block';
                // Keep form values so user doesn't have to re-enter everything
            }
        });

        // Clear error messages when user starts typing in any field
        ['first', 'last', 'nickname', 'password'].forEach(fieldName => {
            document.getElementById(fieldName).addEventListener('input', () => {
                if (fieldName !== 'nickname') { // Don't clear nickname-specific errors immediately
                    errorDiv.style.display = 'none';
                }
                successDiv.style.display = 'none';
            });
        });
    </script>
</body>
</html>
