<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - h2ktalk.fun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000080;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            line-height: 1.5;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            padding: 48px;
            max-width: 420px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 32px;
        }

        .logo {
            width: 64px;
            height: 64px;
            background: #ff4500;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #ffffff;
            font-size: 2rem;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 32px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ffffff;
            font-weight: bold;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            transition: border-color 0.2s;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #ff4500;
        }
        
        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .login-btn {
            width: 100%;
            background: #ff4500;
            color: white;
            border: 2px solid #ff4500;
            padding: 14px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 16px;
        }

        .login-btn:hover {
            background: #ff6600;
            border-color: #ff6600;
        }

        .login-btn:disabled {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed;
        }

        .error-message {
            background: rgba(220, 38, 38, 0.2);
            color: #ffffff;
            border: 1px solid #dc2626;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            display: none;
        }

        .success-message {
            background: rgba(255, 69, 0, 0.2);
            color: #ffffff;
            border: 1px solid #ff4500;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            display: none;
        }

        .info-box {
            background: rgba(255, 69, 0, 0.1);
            border: 1px solid #ff4500;
            border-radius: 4px;
            padding: 16px;
            margin-top: 24px;
        }

        .info-box h3 {
            color: #ffffff;
            font-size: 0.9rem;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .info-box p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            
            .login-container {
                padding: 40px 30px;
                max-width: 100%;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .logo {
                width: 56px;
                height: 56px;
                font-size: 24px;
            }
            
            input[type="text"], input[type="password"] {
                padding: 14px;
                font-size: 16px; /* Prevents zoom on iOS */
            }
            
            .login-btn {
                padding: 16px;
                font-size: 1rem;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .login-container {
                padding: 30px 20px;
                margin: 0;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .subtitle {
                font-size: 0.85rem;
            }
            
            .logo {
                width: 48px;
                height: 48px;
                font-size: 20px;
            }
            
            label {
                font-size: 0.8rem;
            }
            
            input[type="text"], input[type="password"] {
                padding: 12px;
            }
            
            .login-btn {
                padding: 14px;
                font-size: 0.9rem;
            }
            
            .info-box {
                padding: 12px;
                margin-top: 20px;
            }
            
            .info-box h3 {
                font-size: 0.8rem;
            }
            
            .info-box p {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-container">
            <div class="logo">🌐</div>
        </div>
        
        <h1>h2ktalk.fun Admin</h1>
        <p class="subtitle">Secure access to server management</p>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            
            <button type="submit" class="login-btn" id="loginBtn">
                Sign In
            </button>
        </form>
        
        <div class="info-box">
            <h3>🔐 Secure Access</h3>
            <p>Enter your admin credentials to access the server dashboard.</p>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }

        function hideMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }

        function setLoading(isLoading) {
            if (isLoading) {
                loginBtn.innerHTML = '<span class="loading"></span>Signing In...';
                loginBtn.disabled = true;
            } else {
                loginBtn.innerHTML = 'Sign In';
                loginBtn.disabled = false;
            }
        }

        // Detect API base URL based on current location
        function getApiBaseUrl() {
            const currentPath = window.location.pathname;
            if (currentPath.includes('/server/public/')) {
                // Running under subdirectory, API is likely on port 3000
                return `${window.location.protocol}//${window.location.hostname}:3000`;
            } else {
                // Running directly from Node.js server
                return '';
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                showError('Please enter both username and password.');
                return;
            }
            
            setLoading(true);
            hideMessages();
            
            try {
                const apiBase = getApiBaseUrl();
                const response = await fetch(`${apiBase}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    showSuccess('Login successful! Redirecting...');
                    setTimeout(() => {
                        const currentPath = window.location.pathname;
                        if (currentPath.includes('/server/public/')) {
                            // Redirect to dashboard in subdirectory
                            window.location.href = './dashboard.html';
                        } else {
                            // Redirect to admin dashboard
                            window.location.href = '/admin';
                        }
                    }, 1000);
                } else {
                    showError(data.message || 'Login failed. Please check your credentials.');
                }
                
            } catch (error) {
                console.error('Login error:', error);
                showError('An error occurred. Please try again.');
            } finally {
                setLoading(false);
            }
        });

        // Auto-focus username field
        document.getElementById('username').focus();
        
        // Clear messages when user starts typing
        document.getElementById('username').addEventListener('input', hideMessages);
        document.getElementById('password').addEventListener('input', hideMessages);
    </script>
</body>
</html>
